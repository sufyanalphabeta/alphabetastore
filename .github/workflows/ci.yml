name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (lint · build · test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alphabeta_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d alphabeta_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/alphabeta_ci?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_for_tests_only_xxxxxxxxxxxxxxxx
      JWT_REFRESH_SECRET: ci_refresh_secret_for_tests_only_xxxxxxxxxxxxxxxx
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ADMIN_NAME: CI Admin
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci_admin_password
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci --runInBand

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      INTERNAL_API_BASE_URL: http://localhost:3001/api/v1
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: false
          tags: alphabeta-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          load: false
          tags: alphabeta-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:3001/api/v1
            NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
            INTERNAL_API_BASE_URL=http://localhost:3001/api/v1
